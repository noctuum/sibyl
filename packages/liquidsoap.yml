name: liquidsoap
strategy: github-tag
upstream:
  project: savonet/liquidsoap
  tag_version_regex: '^v([0-9.]+(-rc[0-9]+)?)$'
pkgver_dash: ''
alerts:
  - match: '^2\.6\.'
    hold: true
    note: New minor version; check the OCaml version, the opam dependencies and the bindings in src/modules/synced
last_updated: "2026-11-22"
current: 2.5.0rc2
