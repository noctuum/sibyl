name: liquidsoap
strategy: github-tag
upstream:
  project: savonet/liquidsoap
  tag_version_regex: '^v([0-9.]+)$'
alerts:
  - match: '^2\.5\.'
    hold: true
    note: New minor version; check the opam dependencies, camomile-embedded replaces the camomile data
last_updated: "2026-11-22"
current: 2.4.6
